# Сборка базового образа base-kit-php и пуш в GHCR.
# Запускается только при изменении файлов базового образа (или вручную).
# Сайты наследуются от ghcr.io/<владелец>/base-kit-php:latest.
name: base-kit-php

on:
  push:
    branches: [main]
    paths:
      - 'docker/php.Dockerfile'
      - 'docker/php/**'
      - '.github/workflows/base-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR требует имена образов в нижнем регистре
      - name: Prepare image names
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push base-kit-php
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/base-kit-php:latest
            ghcr.io/${{ env.GHCR_OWNER }}/base-kit-php:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
