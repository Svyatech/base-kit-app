# Деплой сайта: мерж в main → собрать образ → запушить в GHCR →
# по SSH сказать VPS перекачать и перезапустить контейнер этого сайта.
#
# Нужные секреты репозитория (Settings → Secrets):
#   VPS_HOST      — адрес сервера
#   VPS_USER      — пользователь для SSH
#   VPS_SSH_KEY   — приватный ключ
#   APP_NAME      — имя сайта (например vietnam): папка /srv/sites/<APP_NAME>
#                   и контейнер <APP_NAME>-app
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docker/php.Dockerfile'   # базовый образ собирает base-image.yml
      - 'docker/php/**'
      - '.github/workflows/base-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR требует имена образов в нижнем регистре
      - name: Prepare image names
        run: |
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.GHCR_OWNER }}/base-kit-php:latest
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE }}:latest
            ghcr.io/${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/sites/${{ secrets.APP_NAME }}
            docker compose pull
            docker compose up -d
            docker image prune -f
