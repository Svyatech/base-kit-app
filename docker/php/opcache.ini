# OPcache для production: скомпилированный PHP кэшируется в памяти,
# файлы не перечитываются с диска на каждый запрос.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=64M

# Разумные лимиты для контентного сайта
memory_limit=256M
upload_max_filesize=20M
post_max_size=25M
max_execution_time=60
